name: Validate SDS migration
on:
  push:
    branches: [main, 'migration/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Initialise imported content if this is the bootstrap commit
        run: |
          if [ ! -f src/content/sds/index.json ]; then npm run import:sds; fi
      - name: Build, compare every original page and test backend behaviour
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-validation
          path: |
            docs/migration/coverage.json
            docs/migration/url-map.csv
            docs/migration/build.json
          retention-days: 30
