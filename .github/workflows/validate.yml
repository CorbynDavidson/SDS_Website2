name: Validate SDS migration
on:
  push:
    branches: [main, 'migration/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Initialise imported content if this is the bootstrap commit
        run: |
          if [ ! -f src/content/sds/index.json ]; then npm run import:sds; fi
      - name: Build and validate the selected source
        run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-validation
          path: |
            docs/migration/coverage.json
            docs/migration/url-map.csv
            docs/migration/build.json
            docs/design-build.json
            docs/migration/metadata-to-current-design.json
            docs/migration/metadata-validation.json
            docs/migration/current-design-sitemap.xml
            docs/migration/content-to-current-design.json
            docs/migration/content-validation.json
            docs/migration/layout-validation.json
            docs/migration/reviews-validation.json
            docs/migration/production-seo-validation.json
            docs/migration/production-routing.json
            docs/migration/production-url-map.csv
          retention-days: 30
