name: Capture original SDS source

on:
  push:
    branches: [main]
    paths: [migration/capture-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sds-source-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture parser
        run: python -m pip install -r requirements-migration.txt
      - name: Capture published pages and first-party resources
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          request=json.loads(Path('migration/capture-request.json').read_text())
          args=['python','-u','scripts/capture-sds.py','--workers','4']
          if request.get('mode')=='resources-only': args.append('--resources-only')
          subprocess.run(args,check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development tools
        run: npm install --ignore-scripts
      - name: Import and verify exact source preservation
        run: |
          npm run import:sds
          npm run check:migration
      - name: Commit source records and media
        run: |
          git config user.name 'SDS migration automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/source-pages migration/source-manifest.json migration/original-sitemap.xml migration/original-robots.txt public src/content/sds src/seo/sds docs/migration/source-inventory.json docs/migration/coverage.json docs/migration/url-map.csv docs/migration/build.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture published SDS pages, metadata and media'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sds-source-capture
          path: |
            migration/source-manifest.json
            migration/source-pages
            migration/original-sitemap.xml
            migration/original-robots.txt
            public
            src/content/sds
            src/seo/sds
            docs/migration
            package-lock.json
          retention-days: 14
