name: Capture original SDS source

on:
  push:
    branches: [main]
    paths: [migration/capture-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sds-source-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture parser
        run: python -m pip install -r requirements-migration.txt
      - name: Capture published pages and first-party resources
        run: python -u scripts/capture-sds.py --workers 4
      - name: Commit source records and media
        run: |
          git config user.name 'SDS migration automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/source-pages migration/source-manifest.json migration/original-sitemap.xml migration/original-robots.txt public docs/migration/source-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'Capture published SDS pages, metadata and media'
            git push origin HEAD:main
          fi
      - name: Verify capture completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('migration/source-manifest.json').read_text())
          assert data['complete'], 'Source capture has unresolved pages or resources; inspect source-inventory.json.'
          print('Verified complete capture:', data['sitemap_url_count'], 'sitemap URLs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sds-source-capture
          path: |
            migration/source-manifest.json
            migration/source-pages
            migration/original-sitemap.xml
            migration/original-robots.txt
            public
            docs/migration/source-inventory.json
          retention-days: 14
